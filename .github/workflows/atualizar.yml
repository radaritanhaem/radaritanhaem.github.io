# Robô do Transparência Itanhaém: coleta os dados oficiais toda madrugada, confere e publica no GitHub Pages.
# Se a conferência falhar, nada é publicado e o site continua com a última versão boa.
# Quando você publica ou edita uma notícia (pasta conteudo/), o site é refeito na hora.
name: Atualizar o portal

on:
  schedule:
    - cron: "0 8 * * *"   # 05:00 no horário de Brasília
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["site/**", "conteudo/**", "coletor/gerar_site.py"]   # notícia nova ou mudança no site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portal
  cancel-in-progress: false

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install pillow playwright pyyaml
          python -m playwright install --with-deps chromium
      - name: Guardar a versão publicada
        run: cp site/camara/dados-site.json /tmp/anterior.json
      - name: Vereadores, propostas e presença
        run: |
          python coletor/coletar.py dados $(seq 2025 $(date +%Y))
          python coletor/verificar.py dados/dados.json dados/verificacao.json
      - name: Licitações (Câmara + PNCP)
        run: python coletor/licitacoes.py dados/licitacoes.json 2025
      - name: Folha de pagamento (Portal da Transparência)
        # se o portal estiver fora do ar, segue com a última folha boa
        # o relatório de cada coleta fica em dados/registro/ para conferência
        continue-on-error: true
        run: |
          mkdir -p dados/registro
          python coletor/folha.py /tmp/folha.json > dados/registro/folha.txt 2>&1 && mv /tmp/folha.json dados/folha.json; s=$?
          tail -40 dados/registro/folha.txt; exit $s
      - name: Prefeitura - gasto pago por secretaria (Dados Abertos)
        # se o portal estiver fora do ar ou vier incompleto, segue com os últimos dados bons
        continue-on-error: true
        run: |
          mkdir -p dados/registro
          (python coletor/prefeitura.py despesas /tmp/pref.json && python coletor/prefeitura.py aceitar /tmp/pref.json dados/prefeitura_despesas.json) > dados/registro/prefeitura.txt 2>&1; s=$?
          tail -40 dados/registro/prefeitura.txt; exit $s
      - name: Prefeitura - compras e licitações homologadas (Dados Abertos)
        continue-on-error: true
        run: |
          mkdir -p dados/registro
          (python coletor/prefeitura.py compras /tmp/compras.json && python coletor/prefeitura.py aceitar-compras /tmp/compras.json dados/prefeitura_compras.json) > dados/registro/compras.txt 2>&1; s=$?
          tail -40 dados/registro/compras.txt; exit $s
      - name: Prefeitura - secretários e conferência com o TCE-SP
        continue-on-error: true
        run: |
          python coletor/prefeitura.py secretarios /tmp/sec.json && mv /tmp/sec.json dados/prefeitura_secretarios.json
          python coletor/prefeitura.py conferir dados/prefeitura_despesas.json /tmp/conf.json && mv /tmp/conf.json dados/prefeitura_conferencia.json
      - name: Prefeitura - associações e entidades sem fins lucrativos que receberam
        # confere a natureza jurídica de cada CNPJ que recebeu (cadastro da Receita); só consulta CNPJs novos
        continue-on-error: true
        run: python coletor/entidades.py dados/prefeitura_despesas.json /tmp/ent.json && mv /tmp/ent.json dados/prefeitura_entidades.json
      - name: Prefeitura na Justiça - precatórios na fila (Tesouro Nacional, RGF)
        continue-on-error: true
        run: python coletor/justica.py /tmp/prec.json && mv /tmp/prec.json dados/prefeitura_precatorios.json
      - name: Alertas do Tribunal de Contas (TCE-SP) para Prefeitura, Câmara e ITAPREV
        # comunicados oficiais de alerta (LRF art. 59) + painel Visor; se o TCE estiver fora do ar, fica a última versão
        continue-on-error: true
        run: python coletor/tce_alertas.py /tmp/alertas.json && mv /tmp/alertas.json dados/tce_alertas.json
      - name: Previdência (ITAPREV) - entra e sai, mês a mês (TCE-SP)
        continue-on-error: true
        run: python coletor/itaprev.py tce /tmp/ita_tce.json && mv /tmp/ita_tce.json dados/itaprev_tce.json
      - name: Previdência (ITAPREV) - pagamentos, compras e folha (portal do instituto)
        continue-on-error: true
        run: |
          mkdir -p dados/registro
          (python coletor/prefeitura.py despesas /tmp/ita_d.json --itaprev && python coletor/prefeitura.py aceitar /tmp/ita_d.json dados/itaprev_despesas.json --itaprev) > dados/registro/itaprev.txt 2>&1; a=$?
          (python coletor/prefeitura.py compras /tmp/ita_c.json --itaprev && python coletor/prefeitura.py aceitar-compras /tmp/ita_c.json dados/itaprev_compras.json --itaprev) >> dados/registro/itaprev.txt 2>&1; b=$?
          (python coletor/itaprev.py folha /tmp/ita_f.json && mv /tmp/ita_f.json dados/itaprev_folha.json) >> dados/registro/itaprev.txt 2>&1; c=$?
          tail -40 dados/registro/itaprev.txt; [ $a -eq 0 ] && [ $b -eq 0 ] && [ $c -eq 0 ]
      - name: Montar os dados do site
        run: |
          python coletor/processar.py dados/dados.json site/camara/dados-site.json
          python coletor/processar_extra.py dados/folha.json dados/licitacoes.json site/camara/dados-site.json
          mkdir -p site/camara/fotos && cp dados/fotos/* site/camara/fotos/
      - name: Conferir antes de publicar
        run: python coletor/validar.py /tmp/anterior.json site/camara/dados-site.json
      - name: Montar as páginas do portal
        run: python coletor/gerar_site.py
      - name: Salvar no repositório
        run: |
          git config user.name "robo-transparencia"
          git config user.email "robo-transparencia@users.noreply.github.com"
          git add dados site
          git diff --cached --quiet || git commit -m "Dados de $(date +%d/%m/%Y)"
          git pull --rebase --autostash -X theirs origin main && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar-manual:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar as páginas do portal
        run: pip install pyyaml && python coletor/gerar_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [coletar, publicar-manual]
    if: always() && (needs.coletar.result == 'success' || needs.publicar-manual.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
